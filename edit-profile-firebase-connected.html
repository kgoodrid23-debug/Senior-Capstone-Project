<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buddiez &amp; Bandz | Edit Profile</title>
    <link rel="stylesheet" href="style.css?v=20260929-universal-3" />
  </head>

  <body class="theme-soft">
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand">
          <div class="brand-icon"><span></span></div>
          <div class="brand-copy">
            Buddiez &amp; Bandz
            <small>EVENTS · PEOPLE · REAL CONNECTIONS</small>
          </div>
        </a>

        <button class="location-select" type="button">
          <span>📍</span>
          <strong id="header-location">Evansville, IN</strong>
          <span>⌄</span>
        </button>

        <nav class="nav" aria-label="Main navigation">
          <a class="nav-link" href="index.html">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
          </a>
          <a class="nav-link" href="events.html">
            <span class="nav-icon">▣</span>
            <span>Events</span>
          </a>
          <a class="nav-link" href="people.html">
            <span class="nav-icon">♟</span>
            <span>People</span>
          </a>
          <a class="nav-link active" href="profile.html">
            <span class="nav-icon">●</span>
            <span>Profile</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="container container--narrow content">
      <section class="card card--padded" aria-labelledby="edit-heading">
        <div class="section-header">
          <h1 class="section-title" id="edit-heading">Edit Profile</h1>
        </div>

        <form id="edit-form" class="form-stack">
          <div class="grid grid--2">
            <div class="form-field">
              <label for="first">First name</label>
              <input class="field-control" type="text" id="first" name="first" autocomplete="given-name" required />
            </div>
            <div class="form-field">
              <label for="last">Last name</label>
              <input class="field-control" type="text" id="last" name="last" autocomplete="family-name" required />
            </div>
          </div>

          <div class="grid grid--2">
            <div class="form-field">
              <label for="age">Age</label>
              <input class="field-control" type="text" id="age" name="age" inputmode="numeric" required />
            </div>
            <div class="form-field">
              <label for="location">Location</label>
              <input class="field-control" type="text" id="location" name="location" required />
            </div>
          </div>

          <div class="form-field">
            <label for="bio">Bio</label>
            <textarea class="field-control" id="bio" name="bio" rows="4"></textarea>
          </div>

          <fieldset class="form-fieldset">
            <legend>Interests</legend>
            <div class="badge-list">
              <label class="badge badge--tag checkbox-field">
                <input type="checkbox" name="tag" value="fitness" />
                <span>🏋 Fitness</span>
              </label>
              <label class="badge badge--tag checkbox-field">
                <input type="checkbox" name="tag" value="volleyball" />
                <span>🏐 Volleyball</span>
              </label>
              <label class="badge badge--tag checkbox-field">
                <input type="checkbox" name="tag" value="church" />
                <span>✝ Church</span>
              </label>
              <label class="badge badge--tag checkbox-field">
                <input type="checkbox" name="tag" value="music" />
                <span>♫ Music</span>
              </label>
            </div>
          </fieldset>

          <div class="button-group">
            <button type="submit" class="btn btn--primary">Save Changes</button>
            <a href="profile.html" class="btn btn--outline">Cancel</a>
          </div>
        </form>
      </section>
    </main>

    <!-- Firebase Web SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc
      } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

      /*
       * STEP 1:
       * Replace the values below with your Firebase Web App configuration.
       * Firebase Console -> Project settings -> Your apps -> Web app -> Config.
       *
       * Do NOT put a Firebase service-account/private key in this file.
       */
      const firebaseConfig = {
        apiKey: "AIzaSyCS7x-v5DU4NW18U_KECav_ynDS16nYXyM",
        authDomain: "buddiez-and-bandz.firebaseapp.com",
        databaseURL: "https://buddiez-and-bandz-default-rtdb.firebaseio.com",
        projectId: "buddiez-and-bandz",
        storageBucket: "buddiez-and-bandz.firebasestorage.app",
        messagingSenderId: "935980744341",
        appId: "1:935980744341:web:614236d3a0bdb9a39aa59c",
        measurementId: "G-NTJNFP82RK"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const form = document.getElementById("edit-form");

      /*
       * For the first test, this uses a fixed dummy user document.
       * Later, replace this with the Firebase Authentication user's uid:
       * const userId = auth.currentUser.uid;
       */
      const userId = localStorage.getItem("buddiezCurrentUserId") || "dummy-user-001";

      function calcAge(dateOfBirth) {
        if (!dateOfBirth) return "";
        const dob = new Date(dateOfBirth);
        const now = new Date();

        let age = now.getFullYear() - dob.getFullYear();
        const month = now.getMonth() - dob.getMonth();

        if (month < 0 || (month === 0 && now.getDate() < dob.getDate())) {
          age--;
        }

        return String(age);
      }

      function ageToDob(age) {
        const ageNum = Number.parseInt(age, 10);
        if (!Number.isInteger(ageNum) || ageNum < 13 || ageNum > 120) {
          return null;
        }

        // Same approach as the current MySQL server code:
        // store January 1 of the birth year as the placeholder DOB.
        return `${new Date().getFullYear() - ageNum}-01-01`;
      }

      function fillForm(profile) {
        const nameParts = String(profile.displayName || "").trim().split(/\s+/);
        const first = nameParts.shift() || "";
        const last = nameParts.join(" ");

        document.getElementById("first").value = first;
        document.getElementById("last").value = last;
        document.getElementById("age").value = calcAge(profile.dateOfBirth);
        document.getElementById("location").value = profile.location || "";
        document.getElementById("bio").value = profile.bio || "";
        document.getElementById("header-location").textContent =
          profile.location || "Evansville, IN";

        const tags = Array.isArray(profile.interests) ? profile.interests : [];

        document.querySelectorAll('input[name="tag"]').forEach((box) => {
          box.checked = tags.map(String).map((tag) => tag.toLowerCase()).includes(
            box.value.toLowerCase()
          );
        });
      }

      async function loadProfile() {
        const profileRef = doc(db, "users", userId);
        const snapshot = await getDoc(profileRef);

        if (!snapshot.exists()) {
          // Create a dummy profile automatically for the first test.
          const dummyProfile = {
            email: "dummy@buddiezandbandz.test",
            passwordHash: "TEST_ONLY",
            displayName: "Alex Carter",
            dateOfBirth: `${new Date().getFullYear() - 21}-01-01`,
            bio: "I enjoy meeting new people, going to events, and listening to music.",
            profilePhotoUrl: "",
            location: "Evansville, IN",
            role: "user",
            isActive: true,
            interests: ["music", "fitness"],
            createdAt: new Date().toISOString()
          };

          await setDoc(profileRef, dummyProfile);
          fillForm(dummyProfile);
          return;
        }

        fillForm(snapshot.data());
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const firstName = document.getElementById("first").value.trim();
        const lastName = document.getElementById("last").value.trim();
        const age = document.getElementById("age").value.trim();
        const location = document.getElementById("location").value.trim();
        const bio = document.getElementById("bio").value.trim();

        if (!firstName || !lastName || !location) {
          alert("First name, last name, and location are required.");
          return;
        }

        const ageNum = Number.parseInt(age, 10);
        if (!Number.isInteger(ageNum) || ageNum < 13 || ageNum > 120) {
          alert("Please enter a valid age.");
          return;
        }

        const interests = Array.from(
          document.querySelectorAll('input[name="tag"]:checked')
        ).map((box) => box.value);

        const profileRef = doc(db, "users", userId);

        const existingSnapshot = await getDoc(profileRef);
        const existingData = existingSnapshot.exists()
          ? existingSnapshot.data()
          : {};

        const updatedProfile = {
          ...existingData,
          displayName: `${firstName} ${lastName}`.slice(0, 100),
          dateOfBirth: ageToDob(ageNum),
          bio,
          location,
          interests,
          updatedAt: new Date().toISOString()
        };

        try {
          await setDoc(profileRef, updatedProfile, { merge: true });

          alert("Profile saved to Firebase!");
          window.location.href = "profile.html";
        } catch (error) {
          console.error("Firebase save error:", error);
          alert("Could not save the profile to Firebase. Check the browser console for details.");
        }
      });

      loadProfile().catch((error) => {
        console.error("Firebase load error:", error);
        alert(
          "Could not load Firebase. Check your Firebase configuration, Firestore setup, and browser console."
        );
      });
    </script>
  </body>
</html>
