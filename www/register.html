<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account | Senior Buddies & Bandz</title>

  <link
    rel="stylesheet"
    href="style.css?v=20260929-universal-2"
  >
</head>

<body class="theme-soft">
  <main class="auth-layout">
    <section class="card card--padded auth-card">
      <a href="index.html" class="brand">
        <div class="brand-icon">
          <span></span>
        </div>

        <div class="brand-copy">
          Senior Buddies & Bandz
          <small>CONNECT • EXPERIENCE • BELONG</small>
        </div>
      </a>

      <div class="auth-heading">
        <h1>Create your account</h1>
        <p>Join the community and discover campus events.</p>
      </div>

      <form id="registerForm" class="form-stack">
        <div class="form-field">
          <label for="firstName">First Name</label>
          <input
            class="field-control"
            type="text"
            id="firstName"
            autocomplete="given-name"
            required
          >
        </div>

        <div class="form-field">
          <label for="lastName">Last Name</label>
          <input
            class="field-control"
            type="text"
            id="lastName"
            autocomplete="family-name"
            required
          >
        </div>

        <div class="form-field">
          <label for="dateOfBirth">Date of Birth</label>
          <input
            class="field-control"
            type="date"
            id="dateOfBirth"
            required
          >
        </div>

        <div class="form-field">
          <label for="location">Location</label>
          <input
            class="field-control"
            type="text"
            id="location"
            placeholder="Evansville, IN"
            autocomplete="address-level2"
            required
          >
        </div>

        <div class="form-field">
          <label for="email">Email Address</label>
          <input
            class="field-control"
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input
            class="field-control"
            type="password"
            id="password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="form-field">
          <label for="profilePhotoUrl">Profile Photo URL</label>

          <input
            class="field-control"
            type="url"
            id="profilePhotoUrl"
            name="profile_photo_url"
            placeholder="https://example.com/photo.jpg"
          />
        </div>

        <div class="form-field">
          <label for="confirmPassword">
            Confirm Password
          </label>
          <input
            class="field-control"
            type="password"
            id="confirmPassword"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <p
          id="registerError"
          class="form-error"
          role="alert"
          aria-live="polite"
        ></p>

        <button
          id="registerButton"
          type="submit"
          class="btn btn--primary btn--block"
        >
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <span>Already have an account?</span>
        <a class="text-link" href="login.html">
          Sign in
        </a>
      </div>
    </section>
  </main>

  <script src="javascript/config.js"></script>
  <script
    type="module"
    src="javascript/register.js"
  ></script>
</body>
</html>
