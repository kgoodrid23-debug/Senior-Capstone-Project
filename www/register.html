<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account | Buddiez & Bandz</title>

  <link
    rel="stylesheet"
    href="style.css?v=20260929-universal-2"
  >
<style>
  .theme-soft { background:#dfeaf7; color:#1d2247; min-height:100vh; font-family:Inter,"Segoe UI",sans-serif; }
  .auth-layout { min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px; padding:36px 20px; }
  .auth-card { width:100%; max-width:480px; padding:36px; background:#fff; border:1px solid #d6dceb; border-radius:18px; box-shadow:0 8px 24px rgba(34,52,107,.09); }
  .auth-card .brand { display:flex; justify-content:center; align-items:center; margin-bottom:28px; }
  .auth-heading { text-align:center; margin-bottom:26px; }
  .auth-heading h1 { color:#1d2a68; font-size:30px; margin:0 0 8px; }
  .auth-heading p { color:#53608b; margin:0; line-height:1.5; }
  .form-stack { display:flex; flex-direction:column; gap:17px; width:100%; }
  .form-field { display:flex; flex-direction:column; gap:7px; min-width:0; }
  .form-field label, .form-fieldset legend { color:#25346d; font-size:14px; font-weight:700; }
  .field-control { width:100%; box-sizing:border-box; padding:12px 14px; min-height:46px; border:1px solid #cbd4e8; border-radius:10px; background:#fff; color:#1d2247; font:inherit; }
  .field-control:focus { outline:2px solid #6475fa; outline-offset:1px; border-color:#3f55f4; }
  .field-heading { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .text-link { color:#3f55f4; text-decoration:none; font-weight:650; }
  .text-link:hover { text-decoration:underline; }
  .checkbox-field { display:inline-flex; align-items:center; gap:8px; font-size:14px; color:#53608b; }
  .checkbox-field input { accent-color:#3f55f4; }
  .form-error { color:#b42332; margin:0; font-size:14px; }
  .form-error:empty { display:none; }
  .btn { display:inline-flex; align-items:center; justify-content:center; padding:12px 20px; min-height:46px; border-radius:10px; font:inherit; font-weight:700; text-decoration:none; cursor:pointer; border:1px solid transparent; }
  .btn--primary { background:#3f55f4; color:#fff; }
  .btn--primary:hover { background:#3044d8; }
  .btn--outline { background:#fff; border-color:#3f55f4; color:#3f55f4; }
  .btn--block { width:100%; }
  .auth-footer { margin-top:24px; display:flex; justify-content:center; flex-wrap:wrap; gap:6px; text-align:center; font-size:14px; color:#53608b; }
  @media(max-width:520px) { .auth-card { padding:25px 20px; } .auth-heading h1 { font-size:26px; } }
</style>
</head>

<body class="theme-soft">
  <main class="auth-layout">
    <section class="card card--padded auth-card">
      <a href="index.html" class="brand">
        <div class="brand-icon">
          <span></span>
        </div>

        <div class="brand-copy">
          Buddiez & Bandz
          <small>EVENTS · PEOPLE · REAL CONNECTIONS</small>
        </div>
      </a>

      <div class="auth-heading">
        <h1>Create your account</h1>
        <p>Join the community and discover campus events.</p>
      </div>

      <form id="registerForm" class="form-stack">
        <div class="form-field">
          <label for="firstName">First Name</label>
          <input
            class="field-control"
            type="text"
            id="firstName"
            autocomplete="given-name"
            required
          >
        </div>

        <div class="form-field">
          <label for="lastName">Last Name</label>
          <input
            class="field-control"
            type="text"
            id="lastName"
            autocomplete="family-name"
            required
          >
        </div>

        <div class="form-field">
          <label for="dateOfBirth">Date of Birth</label>
          <input
            class="field-control"
            type="date"
            id="dateOfBirth"
            required
          >
        </div>

        <div class="form-field">
          <label for="location">Location</label>
          <input
            class="field-control"
            type="text"
            id="location"
            placeholder="Evansville, IN"
            autocomplete="address-level2"
            required
          >
        </div>

        <div class="form-field">
          <label for="email">Email Address</label>
          <input
            class="field-control"
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input
            class="field-control"
            type="password"
            id="password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="form-field">
          <label for="profilePhotoUrl">Profile Photo URL</label>

          <input
            class="field-control"
            type="url"
            id="profilePhotoUrl"
            name="profile_photo_url"
            placeholder="https://example.com/photo.jpg"
          />
        </div>

        <div class="form-field">
          <label for="confirmPassword">
            Confirm Password
          </label>
          <input
            class="field-control"
            type="password"
            id="confirmPassword"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <p
          id="registerError"
          class="form-error"
          role="alert"
          aria-live="polite"
        ></p>

        <button
          id="registerButton"
          type="submit"
          class="btn btn--primary btn--block"
        >
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <span>Already have an account?</span>
        <a class="text-link" href="login.html">
          Sign in
        </a>
      </div>
    </section>
  </main>

  <script src="javascript/config.js"></script>
  <script
    type="module"
    src="javascript/register.js"
  ></script>
</body>
</html>
