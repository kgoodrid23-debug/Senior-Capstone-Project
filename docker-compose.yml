services:
  frontend:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

  backend:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             flask --app app run --host=0.0.0.0 --port=5000"