<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buddiez & Bandz | Edit Profile</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Page-specific styles for the edit form only — style.css is untouched */
      .edit-main {
        max-width: 640px;
        margin: 28px auto 60px;
      }

      .edit-card {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(214, 220, 235, 0.9);
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(34, 52, 107, 0.08);
        padding: 28px 26px 26px;
      }

      .edit-card h1 {
        font-size: 1.8rem;
        color: #1d2a68;
        margin-bottom: 20px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 14px;
      }

      .field {
        margin-bottom: 14px;
      }

      .field label {
        display: block;
        font-weight: 700;
        font-size: 0.9rem;
        color: #3d4b7a;
        margin-bottom: 6px;
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--border, #e4e8f2);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 1rem;
        color: #1d2247;
        background: #fff;
      }

      .field input:focus,
      .field textarea:focus {
        outline: 2px solid var(--primary, #3f55f4);
        outline-offset: 1px;
      }

      .field textarea {
        resize: vertical;
        min-height: 80px;
      }

      .tags-field {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
      }

      .tag-checkbox {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 14px;
        border-radius: 18px;
        font-weight: 700;
        font-size: 0.9rem;
        border: 1px solid rgba(66, 88, 158, 0.18);
        background: #f4f6fb;
        color: #4c5a86;
        cursor: pointer;
      }

      .tag-checkbox input {
        accent-color: var(--primary, #3f55f4);
      }

      .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 8px;
      }

      .save-btn {
        background: linear-gradient(180deg, #2f6ef8, #2a5fe7);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 13px 22px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(47, 110, 248, 0.22);
      }

      .cancel-link {
        display: inline-flex;
        align-items: center;
        padding: 13px 22px;
        border-radius: 12px;
        font-weight: 700;
        color: #3d4b7a;
        border: 1px solid var(--border, #e4e8f2);
        background: #fff;
      }

      @media (max-width: 560px) {
        .field-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="profile-page-body">
    <header class="site-header">
      <div class="page header-inner">
        <a href="index.html" class="brand">
          <div class="brand-icon"><span></span></div>
          <div class="brand-copy">
            Buddiez &amp; Bandz
            <small>EVENTS · PEOPLE · REAL CONNECTIONS</small>
          </div>
        </a>

        <button class="location-select">
          <span>📍</span>
          <strong id="header-location">Evansville, IN</strong>
          <span>⌄</span>
        </button>

        <nav class="nav">
          <a class="nav-link" href="index.html">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
          </a>
          <a class="nav-link" href="#">
            <span class="nav-icon">▣</span>
            <span>Events</span>
          </a>
          <a class="nav-link" href="#">
            <span class="nav-icon">♟</span>
            <span>People</span>
          </a>
          <a class="nav-link active" href="profile.html">
            <span class="nav-icon">●</span>
            <span>Profile</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="page edit-main">
      <section class="edit-card">
        <h1>Edit Profile</h1>

        <form id="edit-form">
          <div class="field-row">
            <div class="field">
              <label for="first">First name</label>
              <input type="text" id="first" name="first" required />
            </div>
            <div class="field">
              <label for="last">Last name</label>
              <input type="text" id="last" name="last" required />
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="age">Age</label>
              <input type="text" id="age" name="age" required />
            </div>
            <div class="field">
              <label for="location">Location</label>
              <input type="text" id="location" name="location" required />
            </div>
          </div>

          <div class="field">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio"></textarea>
          </div>

          <div class="field">
            <label>Interests</label>
            <div class="tags-field">
              <label class="tag-checkbox">
                <input type="checkbox" name="tag" value="fitness" />
                🏋 Fitness
              </label>
              <label class="tag-checkbox">
                <input type="checkbox" name="tag" value="volleyball" />
                🏐 Volleyball
              </label>
              <label class="tag-checkbox">
                <input type="checkbox" name="tag" value="church" />
                ✝ Church
              </label>
              <label class="tag-checkbox">
                <input type="checkbox" name="tag" value="music" />
                ♫ Music
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="save-btn">Save Changes</button>
            <a href="profile.html" class="cancel-link">Cancel</a>
          </div>
        </form>
      </section>
    </main>

    <script>
      // Known interest tags: id -> { emoji, label, color class used in profile.html }
      const TAG_CATALOG = {
        fitness: { emoji: "🏋", label: "Fitness", color: "green" },
        volleyball: { emoji: "🏐", label: "Volleyball", color: "purple" },
        church: { emoji: "✝", label: "Church", color: "blue" },
        music: { emoji: "♫", label: "Music", color: "pink" },
      };

      // Fallback defaults, used only if profile.html didn't pass any values in yet
      const DEFAULTS = {
        first: "Maya",
        last: "Carter",
        age: "21",
        location: "Evansville, IN",
        bio: "Computer science student who loves good people, good events, and making the most of college life.",
        tags: "fitness,volleyball,church,music",
      };

      const params = new URLSearchParams(window.location.search);

      function getParam(key) {
        return params.has(key) ? params.get(key) : DEFAULTS[key];
      }

      // Pre-fill the form with whatever profile.html is currently showing
      document.getElementById("first").value = getParam("first");
      document.getElementById("last").value = getParam("last");
      document.getElementById("age").value = getParam("age");
      document.getElementById("location").value = getParam("location");
      document.getElementById("bio").value = getParam("bio");
      document.getElementById("header-location").textContent = getParam("location");

      const currentTags = getParam("tags").split(",").filter(Boolean);
      document.querySelectorAll('input[name="tag"]').forEach((box) => {
        box.checked = currentTags.includes(box.value);
      });

      // On submit, build a query string and send the user back to profile.html
      document.getElementById("edit-form").addEventListener("submit", function (e) {
        e.preventDefault();

        const selectedTags = Array.from(document.querySelectorAll('input[name="tag"]:checked')).map(
          (box) => box.value
        );

        const out = new URLSearchParams({
          first: document.getElementById("first").value.trim(),
          last: document.getElementById("last").value.trim(),
          age: document.getElementById("age").value.trim(),
          location: document.getElementById("location").value.trim(),
          bio: document.getElementById("bio").value.trim(),
          tags: selectedTags.join(","),
        });

        window.location.href = "profile.html?" + out.toString();
      });
    </script>
  </body>
</html>
